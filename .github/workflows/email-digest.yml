name: Email Digest

# Runs the Gmail checker on a schedule and delivers a readable summary to Telegram.
# Free: GitHub Actions gives public repos 2,000 minutes/month.

on:
  schedule:
    # Cron is UTC (no timezone support). Singapore is UTC+8.
    # 01:00 UTC = 09:00 SGT  |  13:00 UTC = 21:00 SGT
    - cron: "0 1,13 * * *"
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  email-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect recent mail
        # Time-window selection (not UNSEEN): the digest must not depend on
        # read/unread state, because other IMAP clients — including Hermes's own
        # Email gateway adapter — mark fetched mail as read on Gmail.
        # The window (12h) matches the twice-daily cadence, so nothing repeats.
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python scripts/check_emails.py --since-hours 12 --limit 25 --json > emails.json
          python -c "import json;d=json.load(open('emails.json'));print(f'{len(d)} message(s) in window')"

      - name: Send summary to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
        run: |
          python scripts/send_to_telegram.py < emails.json
