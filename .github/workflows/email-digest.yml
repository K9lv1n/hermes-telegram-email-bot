name: Email Digest

# Runs the Gmail checker on a schedule and delivers a readable summary to Telegram.
# Completely free: GitHub Actions gives public repos 2,000 minutes/month.

on:
  schedule:
    # Cron is in UTC (no timezone support). Singapore is UTC+8.
    # 01:00 UTC = 09:00 SGT   |   13:00 UTC = 21:00 SGT
    - cron: "0 1,13 * * *"
  workflow_dispatch: # lets you trigger manually from the Actions tab

jobs:
  email-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Gmail inbox
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          # --mark-read so each run only reports NEW mail (no repeats)
          python scripts/check_emails.py --limit 15 --mark-read --json > emails.json

      - name: Send summary to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
        run: |
          python scripts/send_to_telegram.py < emails.json
