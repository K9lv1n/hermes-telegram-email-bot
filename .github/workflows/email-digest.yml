name: Email Digest

# Delivers a readable Gmail summary to Telegram.
#
# Timing: GitHub's native `schedule:` is best-effort and can run HOURS late.
# For punctual delivery, an external scheduler (e.g. cron-job.org, free) should
# call the dispatch API at exactly 09:00 / 21:00 SGT. The dedupe gate below
# (scripts/should_run.py) ensures a late native run never double-sends.

on:
  schedule:
    # FALLBACK ONLY. Intended delivery is 09:00 / 21:00 SGT, triggered punctually
    # by scripts/trigger_digest.py via a local Hermes cron job. These fallback
    # times sit 4h later but stay *inside the same 12h slot*, so the dedupe gate
    # skips them whenever the punctual trigger already fired. They cover the
    # case where the local machine is off at the intended time.
    # 05:00 & 17:00 UTC = 13:00 & 01:00 SGT
    - cron: "0 5,17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if a digest already went out in this slot"
        type: boolean
        default: false

permissions:
  actions: read   # needed by the dedupe gate to list recent runs
  contents: read

jobs:
  email-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide whether to run
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: email-digest.yml
          FORCE_RUN: ${{ inputs.force }}
        run: echo "run=$(python scripts/should_run.py)" >> "$GITHUB_OUTPUT"

      - name: Collect recent mail
        if: steps.gate.outputs.run == 'yes'
        # Time-window selection (NOT unread): the digest must not depend on
        # read/unread state, because any IMAP client that fetches a body sets
        # Gmail's \Seen flag. 12h matches the twice-daily cadence.
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python scripts/check_emails.py --since-hours 12 --limit 25 --json > emails.json
          python -c "import json;d=json.load(open('emails.json'));print(f'{len(d)} message(s) in window')"

      - name: Send summary to Telegram
        if: steps.gate.outputs.run == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
        run: |
          python scripts/send_to_telegram.py < emails.json
